name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: docs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d docs_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      WEBHOOK_SECRET: ci-secret
      TEST_DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/docs_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
